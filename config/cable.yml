# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# Solid Cable also depends on ON CONFLICT (upsert), unsupported by siscartd's
# PostgreSQL version (see config/environments/production.rb). Action Cable
# isn't actually used anywhere in this app, so the in-process async adapter
# (same as development) is a safe stand-in rather than a real fix.
production:
  adapter: async
